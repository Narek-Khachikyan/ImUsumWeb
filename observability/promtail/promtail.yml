server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: harness-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: harness
          service: backend
          __path__: /var/log/harness/backend.log

  - job_name: harness-frontend
    static_configs:
      - targets: [localhost]
        labels:
          job: harness
          service: frontend
          __path__: /var/log/harness/frontend.log
